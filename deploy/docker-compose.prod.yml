# Развёртывание на сервере с caddy-docker-proxy: Caddy сам читает метки контейнера
# и начинает отдавать домен, сертификат получает сам.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --remove-orphans
#
# Секреты — в deploy/.env (образец: deploy/.env.example); в репозиторий он не попадает.
# Образ собирается отдельно (deploy/deploy.sh) и должен уже быть на сервере.
#
# База — в общем контейнере PostgreSQL на сервере (контейнер postgres из проекта smena,
# имя в сети — db): своя база smenav2 и своя роль smenav2, без прав на чужие базы.
name: smenav2

services:
  app:
    image: ${SMENA_IMAGE:-smenav2:latest}
    restart: unless-stopped
    environment:
      Database__ConnectionString: Host=${DB_HOST:-db};Database=smenav2;Username=smenav2;Password=${DB_PASSWORD:?задайте DB_PASSWORD в deploy/.env}
      Root__BootstrapPassword: ${ROOT_PASSWORD:?задайте ROOT_PASSWORD в deploy/.env}
      Cashier__BootstrapToken: ${CASHIER_TOKEN:?задайте CASHIER_TOKEN в deploy/.env}
      # Адрес, который попадает в QR для загрузки фото с телефона.
      Photos__PublicBaseUrl: https://${SMENA_DOMAIN:?задайте SMENA_DOMAIN в deploy/.env}
      # Сервер стоит за Caddy: настоящую схему (https) и адрес клиента он берёт из
      # заголовков X-Forwarded-*. Контейнер доступен только из сетей caddy и базы.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Необязательное; пустые значения выключают соответствующую часть.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ProxyUri: ${TELEGRAM_PROXY_URI:-}
      MoySklad__Token: ${MOYSKLAD_TOKEN:-}
    volumes:
      - photos:/data/photos
      - keys:/data/keys
    networks:
      - db
      - caddy
    labels:
      caddy: ${SMENA_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      # Сертификат настраивается глобально (acme_dns); меток caddy.tls здесь быть не должно:
      # одна неверная ломает конфигурацию Caddy для всех сайтов сразу.

volumes:
  photos:
  keys:

networks:
  caddy:
    external: true
  # Сеть, в которой живёт общий PostgreSQL. Её создаёт проект smena; если его
  # когда-нибудь уберут, сеть (и контейнер базы) нужно будет перенести сюда.
  db:
    name: ${DB_NETWORK:-smena}
    external: true
